<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg-lp-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <filter id="shadow-lp-02" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-lp-02)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)" filter="url(#shadow-lp-02)">
    <rect width="1040" height="650" rx="12" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>

    <!-- Browser Bar -->
    <rect width="1040" height="48" rx="12" fill="#FAF5FF"/>
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#E9D5FF" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#D8B4FE"/>
    <circle cx="44" cy="24" r="5" fill="#D8B4FE"/>
    <circle cx="60" cy="24" r="5" fill="#D8B4FE"/>
    <rect x="360" y="12" width="320" height="24" rx="6" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="520" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A855F7" text-anchor="middle">promo.produkunggulan.id</text>

    <!-- Navigation Header -->
    <g transform="translate(50, 75)">
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#18181B">CONVERT<tspan fill="#9333EA">PAGE</tspan></text>
      <text x="420" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#71717A">Keunggulan</text>
      <text x="530" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#71717A">Testimoni</text>
      <text x="630" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#71717A">Paket Harga</text>
      <rect x="800" y="-3" width="140" height="32" rx="6" fill="#9333EA"/>
      <text x="870" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pesan Sekarang</text>
    </g>

    <line x1="50" y1="120" x2="990" y2="120" stroke="#F4F4F5" stroke-width="1"/>

    <!-- Hero Landing Page -->
    <g transform="translate(60, 160)">
