      <text x="30" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7E22CE">★ 4.9/5 Rating Kepuasan</text>
      <text x="250" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#52525B">• 2.400+ Konsumen Telah Bergabung</text>
      <text x="540" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#52525B">• Garansi Uang Kembali 100%</text>
      <text x="790" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#52525B">• Pengiriman Cepat</text>
    </g>

    <!-- 3 Value Props -->
    <g transform="translate(60, 485)">
      <g transform="translate(0, 0)">
        <rect width="290" height="120" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
        <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#18181B">Loading Cepat 99/100</text>
        <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#71717A">Optimasi kode tanpa beban berat, pengunjung langsung masuk tanpa tunggu.</text>
        <rect x="20" y="85" width="85" height="20" rx="4" fill="#DCFCE7"/>
        <text x="62" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">PAGE SPEED 99</text>
      </g>
      <g transform="translate(315, 0)">
        <rect width="290" height="120" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
        <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#18181B">Form Lead &amp; WhatsApp</text>
        <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#71717A">Koneksi instan ke customer service dengan template pesan otomatis rapi.</text>
        <rect x="20" y="85" width="95" height="20" rx="4" fill="#F3E8FF"/>
        <text x="67" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#9333EA" text-anchor="middle">ONE-CLICK CHAT</text>
      </g>
      <g transform="translate(630, 0)">
        <rect width="290" height="120" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
        <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#18181B">Responsif di Semua HP</text>
