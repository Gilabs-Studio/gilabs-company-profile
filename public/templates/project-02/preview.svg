        <rect x="20" y="85" width="90" height="20" rx="4" fill="#E0F2FE"/>
        <text x="65" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">MOBILE READY</text>
      </g>
    </g>
