      <text x="85" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#9333EA" text-anchor="middle">HIGH-CONVERTING LANDING PAGE</text>
      <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#18181B">Tingkatkan Penjualan &amp; Lead</text>
      <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#9333EA">Dengan Halaman Penawaran Tepat</text>
      <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#71717A">Desain persuasif yang dirancang khusus untuk memikat calon pembeli dan langsung terhubung ke WhatsApp.</text>

      <rect x="0" y="165" width="170" height="40" rx="8" fill="#16A34A"/>
      <text x="85" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order via WhatsApp</text>

      <rect x="185" y="165" width="130" height="40" rx="8" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
      <text x="250" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#18181B" text-anchor="middle">Pelajari Fitur</text>
