<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" class="w-auto h-full">
  <!-- Academic Crest Shield Emblem in Warm Charcoal / Orange -->
  <g transform="translate(6, 8)">
    <!-- Outer Shield Hexagon -->
    <path d="M28 2 L52 14 V38 C52 50 40 58 28 62 C16 58 4 50 4 38 V14 L28 2 Z" 
          stroke="#17130E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(23, 19, 14, 0.06)"/>
    <!-- Inner Book / Wings of Knowledge -->
    <path d="M14 26 C20 23 25 24 28 26 C31 24 36 23 42 26 V42 C36 39 31 40 28 42 C25 40 20 39 14 42 V26 Z" 
          stroke="#17130E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Central Torch Flame / Beacon -->
    <circle cx="28" cy="18" r="3.5" fill="#FF5A1F"/>
    <path d="M28 12 V15" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark Pure Typography -->
  <text x="74" y="36" fill="#17130E" font-family="'Neue Montreal', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="3.5">LOREM</text>
  <text x="75" y="52" fill="#EA580C" font-family="'Neue Montreal', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="4">POLYTECHNIC INSTITUTE</text>
</svg>
