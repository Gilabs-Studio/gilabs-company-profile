<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg-cp-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow-cp-01" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-cp-01)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)" filter="url(#shadow-cp-01)">
    <rect width="1040" height="650" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Browser Bar -->
    <rect width="1040" height="48" rx="12" fill="#F8FAFC"/>
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="24" r="5" fill="#CBD5E1"/>
    <circle cx="44" cy="24" r="5" fill="#CBD5E1"/>
    <circle cx="60" cy="24" r="5" fill="#CBD5E1"/>
    <rect x="360" y="12" width="320" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="520" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">www.mitrakorporat.co.id</text>

    <!-- Navigation Header -->
    <g transform="translate(50, 75)">
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0F172A">ELEVATE<tspan fill="#2563EB">CORP</tspan></text>
      <text x="320" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Beranda</text>
      <text x="400" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Tentang Kami</text>
      <text x="510" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Layanan</text>
      <text x="590" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Portofolio</text>
      <text x="680" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Kontak</text>
      <rect x="830" y="-3" width="110" height="32" rx="6" fill="#0F172A"/>
      <text x="885" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Hubungi Kami</text>
    </g>

    <line x1="50" y1="120" x2="990" y2="120" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Hero Company Profile -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="160" height="22" rx="4" fill="#EFF6FF"/>
      <text x="80" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">COMPANY PROFILE TEMPLATE</text>
      <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0F172A">Mitra Terpercaya untuk Solusi</text>
      <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#2563EB">Bisnis &amp; Industri Skala Nasional</text>
      <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Membangun keunggulan operasional dengan integritas, inovasi, dan keahlian teruji selama lebih dari 10 tahun.</text>

      <rect x="0" y="165" width="150" height="38" rx="8" fill="#0F172A"/>
      <text x="75" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Profil Perusahaan</text>

      <rect x="165" y="165" width="130" height="38" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="230" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#0F172A" text-anchor="middle">Lihat Portofolio</text>
    </g>

    <!-- Company Stats Box -->
    <g transform="translate(60, 400)">
      <rect width="920" height="75" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <g transform="translate(40, 20)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">12+</text>
        <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Tahun Pengalaman</text>
      </g>
      <g transform="translate(260, 20)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">250+</text>
        <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Proyek Selesai</text>
      </g>
      <g transform="translate(480, 20)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">98%</text>
        <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Kepuasan Klien</text>
      </g>
      <g transform="translate(700, 20)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">ISO 9001</text>
        <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Tersertifikasi Mutu</text>
      </g>
    </g>

    <!-- 3 Services Highlight Row -->
    <g transform="translate(60, 500)">
      <g transform="translate(0, 0)">
        <rect width="290" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Konsultasi Manajemen</text>
        <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Perencanaan strategis dan efisiensi rantai pasok terintegrasi.</text>
        <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Selengkapnya →</text>
      </g>
      <g transform="translate(315, 0)">
        <rect width="290" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Konstruksi &amp; Rekayasa</text>
        <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Pengerjaan infrastruktur berstandar keselamatan tinggi.</text>
        <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Selengkapnya →</text>
      </g>
      <g transform="translate(630, 0)">
        <rect width="290" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Pengadaan &amp; Logistik</text>
        <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Distribusi barang dan logistik tepat waktu ke seluruh Indonesia.</text>
        <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Selengkapnya →</text>
      </g>
    </g>
  </g>
</svg>
